<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>জ্ঞানকোষ — অ্যাডমিন</title>
</head>
<body>
<!--
  ========================================================================
  জ্ঞানকোষ LMS — অ্যাডমিন অ্যাপ (Supabase দিয়ে তৈরি)
  ========================================================================
  এই ফাইল শুধু অ্যাডমিনদের জন্য। ইউজার/লার্নার অ্যাপ আলাদা ফাইলে (index.html)।
  দুটো ফাইলই একই Supabase ডাটাবেজে সংযুক্ত, তাই এখানে যা যোগ/ডিলিট করবেন
  তা ইউজার অ্যাপে সাথে সাথে (রিয়েল-টাইমে) দেখা যাবে।
  ========================================================================
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap');
  :root { --ink:#17243D; --ink-soft:#3C4A63; --gold:#D4A24C; --teal:#2F6F6F; --cream:#FBF8F2; --line:#E6DFD2; --danger:#B5533C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #EDEAE2; }
  .app-shell { font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif; background:var(--cream); color:var(--ink);
    max-width:420px; margin:0 auto; min-height:100vh; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  @media (min-width: 480px) { .app-shell { min-height: 640px; margin: 24px auto; border-radius: 22px; box-shadow: 0 1px 3px rgba(23,36,61,0.08); } }
  .header { background:var(--ink); color:var(--cream); padding:18px 20px 20px; display:flex; align-items:center; gap:10px; }
  .header-text { flex:1; min-width:0; }
  .header-text h1 { font-family:'Tiro Bangla',serif; font-size:18px; margin:0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-text p { margin:2px 0 0; font-size:12px; color:#C9D2DE; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .back-btn, .header-icon-btn { background:rgba(255,255,255,0.1); border:none; color:var(--cream); border-radius:9px; padding:8px; cursor:pointer; display:flex; flex-shrink:0; }
  .content { flex:1; padding:20px; overflow-y:auto; padding-bottom:90px; }
  .bottom-nav { position:absolute; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px 10px; }
  .nav-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--ink-soft); font-size:11px; font-family:inherit; cursor:pointer; border-radius:10px; }
  .nav-btn.active { color:var(--teal); font-weight:600; }
  .section-title { font-family:'Tiro Bangla',serif; font-size:21px; margin:0 0 4px; font-weight:500; }
  .section-sub { font-size:13px; color:var(--ink-soft); margin:0 0 18px; }
  .home-hero { background:var(--ink); border-radius:16px; padding:22px 18px; color:var(--cream); margin-bottom:18px; }
  .home-hero h2 { font-family:'Tiro Bangla',serif; font-size:20px; margin:10px 0 6px; font-weight:500; }
  .home-hero p { font-size:13px; color:#C9D2DE; margin:0; line-height:1.6; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-grid.three { grid-template-columns:1fr 1fr 1fr; }
  .stat-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; }
  .stat-num { font-family:'Tiro Bangla',serif; font-size:24px; color:var(--teal); margin:0; }
  .stat-label { font-size:11.5px; color:var(--ink-soft); margin:2px 0 0; }
  .quick-list { display:flex; flex-direction:column; gap:10px; }
  .quick-card { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; font-family:inherit; text-align:left; width:100%; }
  .quick-card-icon { width:38px; height:38px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; color:var(--teal); flex-shrink:0; }
  .quick-card-text p:first-child { margin:0; font-weight:600; font-size:14px; }
  .quick-card-text p:last-child { margin:2px 0 0; font-size:12px; color:var(--ink-soft); }
  .cat-card { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .cat-card-icon { width:38px; height:38px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
  .cat-card-body { flex:1; min-width:0; cursor:pointer; }
  .cat-card-body p:first-child { margin:0; font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-card-body p.desc { margin:2px 0 0; font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-card-body p:last-child { margin:3px 0 0; font-size:12px; color:var(--ink-soft); }
  .item-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .item-icon { width:32px; height:32px; border-radius:9px; background:var(--cream); color:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .item-info { flex:1; min-width:0; }
  .item-title { margin:0; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-link { font-size:12px; color:var(--teal); text-decoration:none; display:inline-flex; align-items:center; gap:2px; margin-top:2px; }
  .icon-btn { background:none; border:none; padding:6px; border-radius:8px; cursor:pointer; color:var(--ink-soft); display:flex; }
  .icon-btn.danger { color:var(--danger); }
  .icon-btn.danger:active { background:#F3E4DF; }
  .add-toggle { width:100%; border:1.5px dashed var(--teal); background:none; color:var(--teal); border-radius:14px; padding:12px; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-family:inherit; margin-top:4px; margin-bottom:22px; }
  .add-form { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:4px; margin-bottom:22px; display:flex; flex-direction:column; gap:10px; }
  .add-form.hidden, .add-toggle.hidden { display:none; }
  .text-input { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; background:var(--cream); color:var(--ink); }
  .text-input:focus { outline:2px solid var(--teal); outline-offset:1px; }
  .url-field { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:var(--cream); }
  .url-field .text-input { border:none; background:none; padding:10px 0; }
  .url-field svg { color:var(--ink-soft); flex-shrink:0; }
  .form-actions { display:flex; gap:8px; }
  .btn { flex:1; padding:10px; border-radius:10px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--teal); color:#fff; }
  .btn.ghost { background:none; color:var(--ink-soft); border:1px solid var(--line); }
  .btn.danger-btn { background:var(--danger); color:#fff; }
  .empty { text-align:center; padding:32px 20px; color:var(--ink-soft); }
  .empty-title { font-weight:600; margin:8px 0 4px; color:var(--ink); font-size:14px; }
  .empty-body { font-size:12.5px; margin:0; }
  .subhead { display:flex; align-items:center; gap:8px; margin:22px 0 10px; }
  .subhead h3 { font-size:14.5px; font-weight:700; margin:0; }
  .subhead .count { font-size:11.5px; color:var(--ink-soft); background:var(--cream); border-radius:999px; padding:2px 9px; }
  .cat-detail-delete { width:100%; margin-top:8px; border:1px solid #E9D2C8; background:#FBF1EC; color:var(--danger); border-radius:12px; padding:12px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .gate { position:absolute; inset:0; background:rgba(23,36,61,0.55); display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; }
  .gate-card { background:#fff; border-radius:18px; padding:24px 20px; width:100%; max-width:300px; text-align:center; }
  .gate-icon { width:44px; height:44px; border-radius:12px; background:var(--cream); color:var(--teal); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .gate-card h3 { margin:0 0 4px; font-family:'Tiro Bangla',serif; font-size:18px; font-weight:500; }
  .gate-sub { margin:0 0 16px; font-size:12px; color:var(--ink-soft); }
  .gate-error { color:var(--danger); font-size:12px; margin:0 0 10px; }
  .gate-hint { font-size:11px; color:var(--ink-soft); margin:12px 0 0; }
  .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-height:560px; }
  .login-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 22px; width:100%; max-width:320px; text-align:center; }
  .login-card h2 { font-family:'Tiro Bangla',serif; font-size:19px; margin:14px 0 4px; font-weight:500; }
  .login-sub { font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .login-card .text-input { margin-bottom:10px; }
  .admin-flag { position:absolute; top:14px; right:14px; background:var(--gold); color:var(--ink); font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px; z-index:5; }
  .toast { position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:9px 18px; border-radius:999px; font-size:12.5px; z-index:30; white-space:nowrap; }
  .config-warning { background: #FBF1EC; border: 1px solid #E9D2C8; color: var(--danger); border-radius: 12px; padding: 16px; font-size: 12.5px; line-height: 1.7; margin: 20px; }
  .config-warning code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>

<div id="app" class="app-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ======================================================================
  // এখানে আপনার Supabase প্রজেক্টের URL ও anon key বসান
  // (index.html এ যা বসিয়েছেন, ঠিক একই মান এখানেও বসান)
  // ======================================================================
  const SUPABASE_URL = "https://ihefqfuzxvytpjkfrmps.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZWZxZnV6eHZ5dHBqa2ZybXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODQzNTcsImV4cCI6MjEwNDI2MDM1N30.7y7vPJC-OpJno_jf0QTxbFA3_5PM9_GCXw4uoVhG74w";
  // ======================================================================

  const isConfigured = SUPABASE_URL && !SUPABASE_URL.startsWith("YOUR_") && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("YOUR_");

  const TABLE = "app_data";
  const ROW_ID = "main";
  const STUDENTS_TABLE = "students";

  const ICONS = {
    home: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    course: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
    shield: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    play: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
    file: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    link: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    chevronLeft: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    chevronRight: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    layers: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    logout: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
    users: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  };

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const state = {
    screen: "boot",
    courses: [],
    students: [],
    studentsLoaded: false,
    activeCourseId: null,
    activeModuleId: null,
    isAdmin: false,
    deleteTarget: null,
    toast: "",
    toastTimer: null,
  };

  function showToast(msg) {
    state.toast = msg;
    render();
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { state.toast = ""; render(); }, 1700);
  }
  function go(screen) {
    state.screen = screen;
    render();
    if (screen === "admin-users" && !state.studentsLoaded) loadStudents();
  }
  function findCourse(id) { return state.courses.find((c) => c.id === id); }
  function findModule(course, id) { return course && course.modules.find((m) => m.id === id); }

  // ---------- Supabase wiring ----------
  let sb = null;
  function initSupabase() {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.from(TABLE).select("courses").eq("id", ROW_ID).single().then(({ data, error }) => {
      if (!error && data && Array.isArray(data.courses)) { state.courses = data.courses; render(); }
    });

    sb.channel("app_data_changes")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: TABLE, filter: `id=eq.${ROW_ID}` }, (payload) => {
        if (payload.new && Array.isArray(payload.new.courses)) { state.courses = payload.new.courses; render(); }
      })
      .subscribe();

    sb.auth.onAuthStateChange((event, session) => {
      state.isAdmin = !!session;
      go(state.isAdmin ? "admin-home" : "adminLogin");
    });
  }

  async function saveCourses() {
    try {
      const { error } = await sb.from(TABLE).update({ courses: state.courses }).eq("id", ROW_ID);
      if (error) throw error;
    } catch (e) { console.error(e); showToast("সংরক্ষণ করতে সমস্যা হয়েছে"); }
  }

  async function loadStudents() {
    const { data, error } = await sb.from(STUDENTS_TABLE).select("*").order("created_at", { ascending: false });
    if (!error && data) { state.students = data; }
    state.studentsLoaded = true;
    render();
  }
  async function addStudent(name, contact) {
    const { data, error } = await sb.from(STUDENTS_TABLE).insert({ id: uid(), name, contact }).select().single();
    if (error) {
      showToast(error.code === "23505" ? "এই নম্বর/ইমেইল দিয়ে আগেই একজন ইউজার আছে" : "যোগ করতে সমস্যা হয়েছে");
      return;
    }
    state.students = [data, ...state.students];
    showToast("ইউজার যোগ হয়েছে"); go("admin-users");
  }
  async function deleteStudent(id) {
    const { error } = await sb.from(STUDENTS_TABLE).delete().eq("id", id);
    if (error) { showToast("মুছতে সমস্যা হয়েছে"); return; }
    state.students = state.students.filter((s) => s.id !== id);
    state.deleteTarget = null;
    showToast("ইউজার মুছে ফেলা হয়েছে"); go("admin-users");
  }

  async function adminLoginSubmit() {
    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;
    const err = document.getElementById("admin-login-error");
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error && err) err.textContent = "ইমেইল বা পাসওয়ার্ড সঠিক নয়";
  }
  async function logout() { try { await sb.auth.signOut(); } catch (e) { /* ignore */ } }

  // ---------- content actions ----------
  function addCourse(title, description) {
    state.courses = [{ id: uid(), title, description, modules: [] }, ...state.courses];
    saveCourses(); showToast("কোর্স যোগ হয়েছে"); go("admin-courses");
  }
  function deleteCourse(id) {
    state.courses = state.courses.filter((c) => c.id !== id);
    state.deleteTarget = null;
    saveCourses(); showToast("কোর্স মুছে ফেলা হয়েছে"); go("admin-courses");
  }
  function addModule(courseId, name) {
    state.courses = state.courses.map((c) => c.id === courseId ? { ...c, modules: [{ id: uid(), name, videos: [], books: [] }, ...c.modules] } : c);
    saveCourses(); showToast("মডিউল যোগ হয়েছে"); go("admin-courseDetail");
  }
  function deleteModule(courseId, moduleId) {
    state.courses = state.courses.map((c) => c.id === courseId ? { ...c, modules: c.modules.filter((m) => m.id !== moduleId) } : c);
    state.deleteTarget = null;
    saveCourses(); showToast("মডিউল মুছে ফেলা হয়েছে"); go("admin-courseDetail");
  }
  function addVideo(courseId, moduleId, title, url) {
    state.courses = state.courses.map((c) => c.id !== courseId ? c : {
      ...c, modules: c.modules.map((m) => m.id === moduleId ? { ...m, videos: [{ id: uid(), title, url }, ...m.videos] } : m),
    });
    saveCourses(); showToast("ভিডিও যোগ হয়েছে"); go("admin-moduleDetail");
  }
  function deleteVideo(courseId, moduleId, vid) {
    state.courses = state.courses.map((c) => c.id !== courseId ? c : {
      ...c, modules: c.modules.map((m) => m.id === moduleId ? { ...m, videos: m.videos.filter((v) => v.id !== vid) } : m),
    });
    saveCourses(); showToast("ভিডিও মুছে ফেলা হয়েছে"); go("admin-moduleDetail");
  }
  function addBook(courseId, moduleId, title, url) {
    state.courses = state.courses.map((c) => c.id !== courseId ? c : {
      ...c, modules: c.modules.map((m) => m.id === moduleId ? { ...m, books: [{ id: uid(), title, url }, ...m.books] } : m),
    });
    saveCourses(); showToast("বই যোগ হয়েছে"); go("admin-moduleDetail");
  }
  function deleteBook(courseId, moduleId, bid) {
    state.courses = state.courses.map((c) => c.id !== courseId ? c : {
      ...c, modules: c.modules.map((m) => m.id === moduleId ? { ...m, books: m.books.filter((b) => b.id !== bid) } : m),
    });
    saveCourses(); showToast("বই মুছে ফেলা হয়েছে"); go("admin-moduleDetail");
  }

  function toggleForm(id) {
    const form = document.getElementById(id + "-form");
    const btn = document.getElementById(id + "-toggle");
    if (form.classList.contains("hidden")) { form.classList.remove("hidden"); btn.classList.add("hidden"); }
    else { form.classList.add("hidden"); btn.classList.remove("hidden"); }
  }

  function logoSvg(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="var(--ink)"/>
      <path d="M17 22c0-1.7 1.3-3 3-3h9v26h-9c-1.7 0-3-1.3-3-3V22z" fill="var(--gold)"/>
      <path d="M47 22c0-1.7-1.3-3-3-3h-9v26h9c1.7 0 3-1.3 3-3V22z" fill="var(--teal)"/>
      <path d="M29 19v26" stroke="var(--ink)" stroke-width="1.4"/>
      <circle cx="32" cy="45" r="4.5" fill="var(--cream)"/>
      <path d="M30.5 43.2l3 1.8-3 1.8v-3.6z" fill="var(--ink)"/>
    </svg>`;
  }

  function header() {
    if (state.screen === "boot" || state.screen === "adminLogin") return "";
    let title = "জ্ঞানকোষ";
    let sub = "অ্যাডমিন অ্যাপ";
    let showBack = false;
    if (state.screen === "admin-courseDetail") { const c = findCourse(state.activeCourseId); title = c ? c.title : title; sub = "মডিউল পরিচালনা"; showBack = true; }
    else if (state.screen === "admin-moduleDetail") { const c = findCourse(state.activeCourseId); const m = findModule(c, state.activeModuleId); title = m ? m.name : title; sub = "ভিডিও ও বই"; showBack = true; }
    else if (state.screen === "admin-users") { sub = "অনুমোদিত ইউজার"; }
    const backTarget = state.screen === "admin-moduleDetail" ? "admin-courseDetail" : "admin-courses";
    const leftEl = showBack ? `<button class="back-btn" onclick="App.go('${backTarget}')" aria-label="ফিরে যান">${ICONS.chevronLeft}</button>` : logoSvg(44);
    const rightEl = showBack ? "" : `<button class="header-icon-btn" onclick="App.logout()" aria-label="লগ আউট">${ICONS.logout}</button>`;
    return `<div class="header">${leftEl}<div class="header-text"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${rightEl}</div>`;
  }

  function bottomNav() {
    if (!["admin-home", "admin-courses", "admin-users"].includes(state.screen)) return "";
    return `<div class="bottom-nav">
      <button class="nav-btn ${state.screen === "admin-home" ? "active" : ""}" onclick="App.go('admin-home')">${ICONS.home}ড্যাশবোর্ড</button>
      <button class="nav-btn ${state.screen === "admin-courses" ? "active" : ""}" onclick="App.go('admin-courses')">${ICONS.course}কোর্স</button>
      <button class="nav-btn ${state.screen === "admin-users" ? "active" : ""}" onclick="App.go('admin-users')">${ICONS.users}ইউজার</button>
    </div>`;
  }

  function emptyState(icon, title, body) { return `<div class="empty">${icon}<p class="empty-title">${esc(title)}</p><p class="empty-body">${esc(body)}</p></div>`; }

  function addToggleAndForm(idPrefix, label, innerFieldsHtml, submitJs) {
    return `
      <button class="add-toggle" id="${idPrefix}-toggle" onclick="App.toggleForm('${idPrefix}')">${ICONS.plus} ${esc(label)}</button>
      <div class="add-form hidden" id="${idPrefix}-form">
        ${innerFieldsHtml}
        <div class="form-actions">
          <button class="btn ghost" onclick="App.toggleForm('${idPrefix}')">বাতিল</button>
          <button class="btn primary" onclick="${submitJs}">যোগ করুন</button>
        </div>
      </div>`;
  }

  function screenBoot() {
    if (!isConfigured) {
      return `<div class="config-warning"><b>Supabase URL/key বসানো হয়নি।</b><br><br>এই ফাইলের শুরুর দিকে <code>SUPABASE_URL</code> ও <code>SUPABASE_ANON_KEY</code> অংশে আপনার প্রজেক্টের তথ্য বসান (index.html-এ যা বসিয়েছেন, একই মান)।</div>`;
    }
    return `<div class="login-wrap"><div class="login-card">${logoSvg(48)}<h2>জ্ঞানকোষ অ্যাডমিন</h2><p class="login-sub">লোড হচ্ছে…</p></div></div>`;
  }

  function screenAdminLogin() {
    return `<div class="gate" style="position:static; background:var(--ink); min-height:640px;">
      <div class="gate-card">
        <div class="gate-icon">${ICONS.shield}</div>
        <h3>জ্ঞানকোষ অ্যাডমিন</h3>
        <p class="gate-sub">Supabase-এ তৈরি করা অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিন</p>
        <input class="text-input" id="admin-email" placeholder="ইমেইল">
        <input class="text-input" type="password" id="admin-password" placeholder="পাসওয়ার্ড" onkeydown="if(event.key==='Enter') App.adminLoginSubmit()">
        <p class="gate-error" id="admin-login-error"></p>
        <button class="btn primary" style="width:100%" onclick="App.adminLoginSubmit()">প্রবেশ করুন</button>
      </div>
    </div>`;
  }

  function screenAdminHome() {
    const totalModules = state.courses.reduce((n, c) => n + c.modules.length, 0);
    const totalVideos = state.courses.reduce((n, c) => n + c.modules.reduce((m2, mo) => m2 + mo.videos.length, 0), 0);
    const totalBooks = state.courses.reduce((n, c) => n + c.modules.reduce((m2, mo) => m2 + mo.books.length, 0), 0);
    return `<div class="home-hero">${ICONS.shield.replace('width="19" height="19"', 'width="26" height="26"')}<h2>অ্যাডমিন ড্যাশবোর্ড</h2><p>একাধিক কোর্স তৈরি করুন, মডিউল সাজান, ভিডিও ও পিডিএফ বই যোগ করুন। ইউজার অ্যাপে সাথে সাথে দেখা যাবে।</p></div>
      <div class="stat-grid three">
        <div class="stat-card"><p class="stat-num">${state.courses.length}</p><p class="stat-label">কোর্স</p></div>
        <div class="stat-card"><p class="stat-num">${totalModules}</p><p class="stat-label">মডিউল</p></div>
        <div class="stat-card"><p class="stat-num">${totalVideos + totalBooks}</p><p class="stat-label">কনটেন্ট</p></div>
      </div>
      <div class="quick-list"><button class="quick-card" onclick="App.go('admin-courses')"><div class="quick-card-icon">${ICONS.course}</div><div class="quick-card-text"><p>সব কোর্স দেখুন</p><p>${totalVideos} ভিডিও • ${totalBooks} বই</p></div></button></div>`;
  }

  function screenAdminCourses() {
    const list = state.courses.length === 0 ? emptyState(ICONS.course, "কোনো কোর্স নেই", "নিচ থেকে নতুন কোর্স যোগ করুন।")
      : state.courses.map((c) => `<div class="cat-card"><div class="cat-card-icon">${ICONS.course}</div><div class="cat-card-body" onclick="App.openAdminCourse('${c.id}')"><p>${esc(c.title)}</p>${c.description ? `<p class="desc">${esc(c.description)}</p>` : ""}<p>${c.modules.length} মডিউল</p></div><button class="icon-btn danger" onclick="App.confirmDelete('course','${c.id}',null,'${esc(c.title).replace(/'/g, "&#39;")}')" aria-label="কোর্স মুছুন">${ICONS.trash}</button></div>`).join("");
    const courseForm = addToggleAndForm("add-course", "নতুন কোর্স যোগ করুন", `<input class="text-input" id="add-course-title" placeholder="কোর্সের নাম"><input class="text-input" id="add-course-desc" placeholder="সংক্ষিপ্ত বিবরণ (ঐচ্ছিক)">`, `App.submitAddCourse()`);
    return `<h2 class="section-title">কোর্স</h2><p class="section-sub">প্রতিটি কোর্সে যত খুশি মডিউল রাখুন</p>${list}${courseForm}`;
  }

  function screenAdminCourseDetail() {
    const c = findCourse(state.activeCourseId);
    if (!c) return emptyState(ICONS.course, "কোর্স পাওয়া যায়নি", "");
    const modulesHtml = c.modules.length === 0 ? emptyState(ICONS.layers, "কোনো মডিউল নেই", "এই কোর্সে এখনো মডিউল যোগ করা হয়নি।")
      : c.modules.map((m) => `<div class="cat-card"><div class="cat-card-icon">${ICONS.layers}</div><div class="cat-card-body" onclick="App.openAdminModule('${m.id}')"><p>${esc(m.name)}</p><p>${m.videos.length} ভিডিও • ${m.books.length} বই</p></div><button class="icon-btn danger" onclick="App.confirmDelete('module','${m.id}','${c.id}','${esc(m.name).replace(/'/g, "&#39;")}')" aria-label="মডিউল মুছুন">${ICONS.trash}</button></div>`).join("");
    const moduleForm = addToggleAndForm("add-module", "নতুন মডিউল যোগ করুন", `<input class="text-input" id="add-module-name" placeholder="মডিউলের নাম (যেমনঃ মডিউল ৩)">`, `App.submitAddModule('${c.id}')`);
    return `${c.description ? `<p class="section-sub" style="margin-top:-4px">${esc(c.description)}</p>` : ""}
      <div class="subhead">${ICONS.layers}<h3>মডিউল</h3><span class="count">${c.modules.length}</span></div>${modulesHtml}${moduleForm}
      <button class="cat-detail-delete" onclick="App.confirmDelete('course','${c.id}',null,'${esc(c.title).replace(/'/g, "&#39;")}')">${ICONS.trash} এই কোর্স মুছে ফেলুন</button>`;
  }

  function screenAdminModuleDetail() {
    const c = findCourse(state.activeCourseId);
    const m = findModule(c, state.activeModuleId);
    if (!c || !m) return emptyState(ICONS.layers, "মডিউল পাওয়া যায়নি", "");
    function itemRow(item, iconKey, actionLabel, onDeleteJs) {
      return `<div class="item-row"><div class="item-icon">${ICONS[iconKey]}</div><div class="item-info"><p class="item-title">${esc(item.title)}</p><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" class="item-link">${actionLabel} ${ICONS.chevronRight}</a></div><button class="icon-btn danger" onclick="${onDeleteJs}" aria-label="মুছুন">${ICONS.trash}</button></div>`;
    }
    const videosHtml = m.videos.length === 0 ? emptyState(ICONS.play, "কোনো ভিডিও নেই", "এই মডিউলে এখনো ভিডিও যোগ করা হয়নি।") : m.videos.map((v) => itemRow(v, "play", "ভিডিও দেখুন", `App.deleteVideo('${c.id}','${m.id}','${v.id}')`)).join("");
    const booksHtml = m.books.length === 0 ? emptyState(ICONS.file, "কোনো বই নেই", "এই মডিউলে এখনো বই যোগ করা হয়নি।") : m.books.map((b) => itemRow(b, "file", "বই খুলুন", `App.deleteBook('${c.id}','${m.id}','${b.id}')`)).join("");
    const videoForm = addToggleAndForm("add-video", "নতুন ভিডিও যোগ করুন", `<input class="text-input" id="add-video-title" placeholder="ভিডিওর শিরোনাম"><div class="url-field">${ICONS.link}<input class="text-input" id="add-video-url" placeholder="ভিডিও লিংক (URL)"></div>`, `App.submitAdd('video','${c.id}','${m.id}')`);
    const bookForm = addToggleAndForm("add-book", "নতুন বই যোগ করুন", `<input class="text-input" id="add-book-title" placeholder="বইয়ের শিরোনাম"><div class="url-field">${ICONS.link}<input class="text-input" id="add-book-url" placeholder="পিডিএফ লিংক (URL)"></div>`, `App.submitAdd('book','${c.id}','${m.id}')`);
    return `<div class="subhead">${ICONS.play}<h3>ভিডিও</h3><span class="count">${m.videos.length}</span></div>${videosHtml}${videoForm}
      <div class="subhead">${ICONS.file}<h3>পিডিএফ বই</h3><span class="count">${m.books.length}</span></div>${booksHtml}${bookForm}
      <button class="cat-detail-delete" onclick="App.confirmDelete('module','${m.id}','${c.id}','${esc(m.name).replace(/'/g, "&#39;")}')">${ICONS.trash} এই মডিউল মুছে ফেলুন</button>`;
  }

  function screenAdminUsers() {
    if (!state.studentsLoaded) return `<div class="empty"><p class="empty-body">লোড হচ্ছে…</p></div>`;
    const list = state.students.length === 0 ? emptyState(ICONS.users, "কোনো ইউজার যোগ করা হয়নি", "নিচ থেকে ইউজার যোগ করুন — শুধু এখানে যোগ করা ইউজাররাই ইউজার অ্যাপে লগইন করতে পারবেন।")
      : state.students.map((s) => `<div class="cat-card"><div class="cat-card-icon">${ICONS.users}</div><div class="cat-card-body" style="cursor:default"><p>${esc(s.name)}</p><p>${esc(s.contact)}</p></div><button class="icon-btn danger" onclick="App.confirmDelete('student','${s.id}',null,'${esc(s.name).replace(/'/g, "&#39;")}')" aria-label="ইউজার মুছুন">${ICONS.trash}</button></div>`).join("");
    const form = addToggleAndForm("add-student", "নতুন ইউজার যোগ করুন", `<input class="text-input" id="add-student-name" placeholder="ইউজারের নাম"><input class="text-input" id="add-student-contact" placeholder="ফোন নম্বর বা ইমেইল">`, `App.submitAddStudent()`);
    return `<h2 class="section-title">অনুমোদিত ইউজার</h2><p class="section-sub">শুধু এই তালিকার ইউজাররাই ইউজার অ্যাপে লগইন করতে পারবেন</p>${list}${form}`;
  }

  function confirmModal() {
    const d = state.deleteTarget;
    if (!d) return "";
    const titleMap = { course: "কোর্স মুছবেন?", module: "মডিউল মুছবেন?", student: "ইউজার মুছবেন?" };
    const bodyMap = {
      course: `"${esc(d.name)}" কোর্সের সব মডিউল, ভিডিও ও বই একসাথে মুছে যাবে।`,
      module: `"${esc(d.name)}" মডিউলের সব ভিডিও ও বই একসাথে মুছে যাবে।`,
      student: `"${esc(d.name)}"-কে মুছে ফেললে তিনি আর ইউজার অ্যাপে লগইন করতে পারবেন না।`,
    };
    const confirmJsMap = {
      course: `App.deleteCourse('${d.id}')`,
      module: `App.deleteModule('${d.parentId}','${d.id}')`,
      student: `App.deleteStudent('${d.id}')`,
    };
    return `<div class="gate"><div class="gate-card"><div class="gate-icon" style="color:var(--danger)">${ICONS.trash}</div><h3>${titleMap[d.type]}</h3><p class="gate-sub">${bodyMap[d.type]}</p>
      <div class="form-actions"><button class="btn ghost" onclick="App.cancelDelete()">বাতিল</button><button class="btn danger-btn" onclick="${confirmJsMap[d.type]}">মুছে ফেলুন</button></div></div></div>`;
  }

  function render() {
    const app = document.getElementById("app");
    if (state.screen === "boot") { app.innerHTML = screenBoot(); return; }
    if (state.screen === "adminLogin") { app.innerHTML = screenAdminLogin(); return; }
    let body = "";
    if (state.screen === "admin-home") body = screenAdminHome();
    else if (state.screen === "admin-courses") body = screenAdminCourses();
    else if (state.screen === "admin-courseDetail") body = screenAdminCourseDetail();
    else if (state.screen === "admin-moduleDetail") body = screenAdminModuleDetail();
    else if (state.screen === "admin-users") body = screenAdminUsers();
    else body = screenAdminHome();
    const toastHtml = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "";
    app.innerHTML = `<div class="admin-flag">অ্যাডমিন মোড</div>${header()}<div class="content">${body}</div>${toastHtml}${bottomNav()}${confirmModal()}`;
  }

  window.App = {
    go, toggleForm, adminLoginSubmit, logout,
    openAdminCourse(id) { state.activeCourseId = id; go("admin-courseDetail"); },
    openAdminModule(id) { state.activeModuleId = id; go("admin-moduleDetail"); },
    confirmDelete(type, id, parentId, name) { state.deleteTarget = { type, id, parentId, name }; render(); },
    cancelDelete() { state.deleteTarget = null; render(); },
    deleteCourse, deleteModule, deleteVideo, deleteBook, deleteStudent,
    submitAddCourse() {
      const title = document.getElementById("add-course-title").value.trim();
      const desc = document.getElementById("add-course-desc").value.trim();
      if (!title) return; addCourse(title, desc);
    },
    submitAddModule(courseId) {
      const name = document.getElementById("add-module-name").value.trim();
      if (!name) return; addModule(courseId, name);
    },
    submitAdd(kind, courseId, moduleId) {
      const title = document.getElementById(`add-${kind}-title`).value.trim();
      const url = document.getElementById(`add-${kind}-url`).value.trim();
      if (!title || !url) return;
      if (kind === "video") addVideo(courseId, moduleId, title, url); else addBook(courseId, moduleId, title, url);
    },
    submitAddStudent() {
      const name = document.getElementById("add-student-name").value.trim();
      const contact = document.getElementById("add-student-contact").value.trim();
      if (!name || !contact) return;
      addStudent(name, contact);
    },
  };

  function boot() {
    state.screen = "boot";
    render();
    if (!isConfigured) return;
    initSupabase();
    // Show the login form immediately; onAuthStateChange will upgrade this to
    // admin-home if a session already exists, instead of us waiting on it.
    state.screen = "adminLogin";
    render();
  }
  boot();
</script>
</body>
</html>
